[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "himagustiv-ctxbudget"
version = "0.1.0"
description = "按段落统计上下文窗口的预算分配相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "himagustiv" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://himagustiv.github.io"
Repository = "https://github.com/himagustiv/ctxbudget"
Issues = "https://github.com/himagustiv/ctxbudget/issues"

[project.scripts]
ctxbudget = "ctxbudget:main"

[tool.setuptools]
py-modules = ["ctxbudget"]
